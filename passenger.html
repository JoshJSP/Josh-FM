<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080a"><title>MAIR Passenger</title><style>*{box-sizing:border-box}body{margin:0;background:#08080a;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:520px;margin:0 auto}.brand{font-size:12px;letter-spacing:.14em;color:#9a9aa2;font-weight:800;margin:8px 0 30px}.card{background:#111217;border:1px solid #25262d;border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.25)}h1{font-size:30px;line-height:1.05;margin:0 0 8px}.muted{color:#9a9aa2;line-height:1.45}.code{display:inline-block;margin:12px 0 22px;padding:7px 11px;border-radius:999px;background:#1c1d23;color:#c7c7ce;font-size:12px;font-weight:800;letter-spacing:.08em}label{display:block;margin:16px 0 7px;font-size:12px;color:#aaaab2;font-weight:700}input{width:100%;border:1px solid #30313a;background:#0c0d11;color:white;border-radius:14px;padding:14px 15px;font-size:16px;outline:none}input:focus{border-color:#7d5cff}button{width:100%;border:0;border-radius:15px;padding:15px 16px;margin-top:16px;background:#7d5cff;color:white;font-size:15px;font-weight:800}button:disabled{opacity:.5}.status{min-height:42px;margin-top:14px;color:#b8b8c0;font-size:14px}.ok{color:#9ae6b4}.err{color:#ff9c9c}.foot{font-size:12px;color:#74747d;margin-top:18px;line-height:1.45}.join{margin:18px 0 8px;padding:14px;border:1px solid #292a32;border-radius:17px;background:#0d0e12}.join label{margin-top:0}.join button{margin-top:10px}</style></head><body><main class="wrap"><div class="brand">MAIRFM · PASSENGER MODE</div><section class="card"><h1>Vraag een nummer aan</h1><p class="muted">MAIR plant je verzoek automatisch op een logisch moment in de muziekflow.</p><div id="join" class="join" hidden><label for="sessionCode">Sessiecode</label><input id="sessionCode" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="Bijv. ABC123"><button id="joinBtn" type="button">Meedoen</button></div><div id="code" class="code">SESSIE —</div><label for="name">Jouw naam</label><input id="name" maxlength="40" placeholder="Bijv. Luca"><label for="query">Nummer of artiest</label><input id="query" maxlength="120" placeholder="Bijv. Fred again.. - Delilah"><button id="send" type="button">Verzoek indienen</button><div id="status" class="status"></div><div class="foot">Je hebt geen Spotify-account nodig. De bestuurder houdt controle over de uiteindelijke wachtrij.</div></section></main><script>const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let code=String(params.get('code')||'').trim().toUpperCase(),valid=false;function showCode(){if(code){$('join').hidden=true;$('code').hidden=false;$('code').textContent=`SESSIE ${code}`}else{$('join').hidden=false;$('code').hidden=true;$('send').disabled=true;status('Vul de 6-teken sessiecode van de bestuurder in.',true)}}async function check(){valid=false;if(!code){showCode();return}try{const r=await fetch('/api/passenger?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.active){$('send').disabled=true;return status(d.error||'Deze sessie is niet actief.',false)}valid=true;$('send').disabled=false;showCode();status('Verbonden met MAIR.',true)}catch{$('send').disabled=true;status('Kan de sessie nu niet bereiken.',false)}}function status(text,ok){$('status').textContent=text;$('status').className='status '+(ok?'ok':'err')}$('joinBtn').onclick=()=>{const entered=$('sessionCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(entered.length!==6)return status('De sessiecode bestaat uit 6 tekens.',false);code=entered;history.replaceState(null,'','?code='+encodeURIComponent(code));check()};$('sessionCode').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));$('sessionCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('joinBtn').click()});$('send').onclick=async()=>{if(!valid)return check();const query=$('query').value.trim(),name=$('name').value.trim()||'Passagier';if(query.length<2)return status('Vul eerst een nummer of artiest in.',false);$('send').disabled=true;status('Verzoek versturen…',true);try{const r=await fetch('/api/passenger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',code,query,name})}),d=await r.json();if(!r.ok)throw Error(d.error||'Verzoek mislukt.');$('query').value='';status('✓ Verzoek ontvangen. MAIR plant hem in.',true)}catch(e){status(e.message||'Verzoek mislukt.',false)}finally{$('send').disabled=false}};$('query').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});showCode();if(code)check();</script></body></html>
