<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080a"><title>MAIR Passenger</title><style>*{box-sizing:border-box}body{margin:0;background:#08080a;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:520px;margin:0 auto}.brand{font-size:12px;letter-spacing:.14em;color:#9a9aa2;font-weight:800;margin:8px 0 30px}.card{background:#111217;border:1px solid #25262d;border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.25)}h1{font-size:30px;line-height:1.05;margin:0 0 8px}.muted{color:#9a9aa2;line-height:1.45}.code{display:inline-block;margin:12px 0 22px;padding:7px 11px;border-radius:999px;background:#1c1d23;color:#c7c7ce;font-size:12px;font-weight:800;letter-spacing:.08em}label{display:block;margin:16px 0 7px;font-size:12px;color:#aaaab2;font-weight:700}input{width:100%;border:1px solid #30313a;background:#0c0d11;color:white;border-radius:14px;padding:14px 15px;font-size:16px;outline:none}input:focus{border-color:#7d5cff}button{width:100%;border:0;border-radius:15px;padding:15px 16px;margin-top:16px;background:#7d5cff;color:white;font-size:15px;font-weight:800}button:disabled{opacity:.5}.status{min-height:42px;margin-top:14px;color:#b8b8c0;font-size:14px}.ok{color:#9ae6b4}.err{color:#ff9c9c}.foot{font-size:12px;color:#74747d;margin-top:18px;line-height:1.45}.join{margin:18px 0 8px;padding:14px;border:1px solid #292a32;border-radius:17px;background:#0d0e12}.join label{margin-top:0}.join button{margin-top:10px}.suggestions{margin-top:8px;border:1px solid #292a32;border-radius:16px;overflow:hidden;background:#0d0e12}.suggestions[hidden]{display:none}.suggestion{width:100%;margin:0;border:0;border-radius:0;background:transparent;color:#fff;padding:10px;display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;text-align:left;border-bottom:1px solid #202128}.suggestion:last-child{border-bottom:0}.suggestion img,.artfallback{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#1b1c22}.artfallback{display:grid;place-items:center;color:#6f7079;font-size:10px}.suggestion b,.suggestion span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suggestion b{font-size:14px}.suggestion span{font-size:12px;color:#9698a2;margin-top:3px}.pick{font-size:12px;color:#a995ff;font-weight:800}.searchnote{font-size:12px;color:#777985;padding:12px}.selected{margin-top:10px;padding:11px 12px;border:1px solid #463c75;background:#171329;border-radius:14px;display:flex;align-items:center;gap:10px}.selected[hidden]{display:none}.selected img{width:46px;height:46px;border-radius:8px;object-fit:cover}.selected div{min-width:0;flex:1}.selected b,.selected span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selected span{font-size:12px;color:#9d9eaa;margin-top:3px}.selected button{width:auto;margin:0;padding:8px 10px;background:#24212f;color:#d8d1ff;font-size:12px}.hint{font-size:11px;color:#777985;margin-top:7px}</style></head><body><main class="wrap"><div class="brand">MAIRFM · PASSENGER MODE</div><section class="card"><h1>Vraag een nummer aan</h1><p class="muted">Typ een titel, artiest of allebei. Kies daarna het exacte nummer.</p><div id="join" class="join" hidden><label for="sessionCode">Sessiecode</label><input id="sessionCode" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="Bijv. ABC123"><button id="joinBtn" type="button">Meedoen</button></div><div id="code" class="code">SESSIE —</div><label for="name">Jouw naam</label><input id="name" maxlength="40" placeholder="Bijv. Luca"><label for="query">Nummer of artiest</label><input id="query" maxlength="120" autocomplete="off" placeholder="Bijv. Levels Avicii"><div class="hint">Volgorde maakt niet uit.</div><div id="suggestions" class="suggestions" hidden></div><div id="selected" class="selected" hidden></div><button id="send" type="button">Verzoek indienen</button><div id="status" class="status"></div><div class="foot">Je hebt geen Spotify-account nodig. De bestuurder houdt controle over de uiteindelijke wachtrij.</div></section></main><script src="passenger.js"></script></body></html>
