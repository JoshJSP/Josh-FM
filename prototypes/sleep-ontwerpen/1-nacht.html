<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sleep 1 Nacht</title>
<!-- Idee: zo weinig licht mogelijk. Alleen donkerpaars op zwart, geen wit. Past op een OLED-scherm naast je bed. Knop "Scherm zwart": helemaal zwart, tik voor de tijd. Weinig werk: CSS en de bestaande timerknoppen. -->
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:#5a3f93;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden}
.s{height:100dvh;padding:22px 24px 28px;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.18em;font-weight:800;color:#2e2150}
.x{width:44px;height:44px;border-radius:50%;border:1px solid #1d1432;color:#3d2c68;font-size:22px;display:grid;place-items:center}
.clock{font-size:128px;font-weight:200;letter-spacing:-.05em;color:#4a3478;line-height:1;margin-top:80px}
.date{color:#2e2150;font-size:15px;margin-top:10px}
.now{margin-top:40px;font-size:15px;color:#3a2a63}.now b{display:block;font-weight:600;font-size:18px;color:#4a3478;margin-bottom:3px}
.left{margin-top:auto;font-size:13px;letter-spacing:.1em;color:#2e2150;font-weight:700}
.big{font-size:44px;font-weight:300;color:#5a3f93;margin:6px 0 18px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row div,.wide div{border:1px solid #1d1432;border-radius:14px;height:54px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#3d2c68}
.row .on{border-color:#3a2a63;color:#7a58c2;background:#0b0615}
.wide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.black{margin-top:8px;border:1px dashed #241a3d;border-radius:14px;height:54px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#4a3478}
.hint{text-align:center;font-size:11px;color:#241a3d;margin-top:14px}
@media (orientation:landscape) and (max-height:500px){
.s{padding:14px 28px;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto 1fr auto;column-gap:40px}
.top{grid-column:1/3}.clock{font-size:118px;margin-top:0;align-self:end;grid-row:2}.date{grid-column:1}.now{grid-column:1;margin-top:10px}
.ctl{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;justify-content:center}.left{margin-top:0}.big{font-size:36px;margin-bottom:12px}.hint{display:none}}
</style></head><body><div class="s">
<div class="top"><span>MAIR SLEEP</span><span class="x">×</span></div>
<div class="clock">23:18</div><div class="date">zaterdag 17 oktober</div>
<div class="now"><b>Midnight City</b>M83</div>
<div class="ctl"><div class="left">STOPT OM 23:48</div><div class="big">nog 30 min</div>
<div class="row"><div>15</div><div class="on">30</div><div>45</div><div>60</div></div>
<div class="wide"><div>Na dit nummer</div><div>Timer uit</div></div>
<div class="black">Scherm zwart, tik voor de tijd</div>
<div class="hint">Na 8 seconden gaat alles nog donkerder</div></div>
</div></body></html>
