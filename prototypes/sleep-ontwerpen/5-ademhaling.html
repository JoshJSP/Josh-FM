<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sleep 5 Ademhaling</title>
<!-- Idee: een grote paarse bol die langzaam groot en klein wordt, als ademhalingsritme. De timer staat in de bol. Middel werk: de animatie (CSS, pauzeren als het scherm dimt zodat de accu niet leeg gaat) testen op iPhone. "Daarna ruis" speelt een ruis- of regenlijst van Spotify via de bestaande playUri; eigen ruis in de browser stopt op iPhone in de achtergrond, dus niet doen. -->
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#06040c;color:#efe6ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden}
.s{height:100dvh;padding:20px 20px 24px;display:flex;flex-direction:column;align-items:center;background:#06040c}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}.k{font-size:11px;letter-spacing:.18em;font-weight:800;color:#a67cf0}.x{width:44px;height:44px;border-radius:50%;border:1px solid #2b1c4b;display:grid;place-items:center;color:#c18aff;font-size:22px}
.np{margin-top:10px;text-align:center;font-size:14px;color:#8d80ad}.np b{color:#d9c8f8;font-weight:600;display:block;font-size:16px}
.orbwrap{flex:1;display:grid;place-items:center;width:100%;position:relative}
.o3,.o2,.o1{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.o3{width:340px;height:340px;background:radial-gradient(circle,rgba(130,60,240,.16),transparent 70%)}
.o2{width:270px;height:270px;background:radial-gradient(circle,rgba(150,80,255,.35),rgba(80,30,170,.08) 70%);border:1px solid rgba(190,140,255,.18)}
.o1{width:200px;height:200px;background:radial-gradient(circle at 38% 32%,#b57cff,#6a2fd8 55%,#2a1160);box-shadow:0 0 70px rgba(140,70,240,.5)}
.in{position:relative;text-align:center;z-index:2}.in b{font-size:44px;font-weight:300;letter-spacing:-.03em;display:block;color:#fff}.in span{font-size:13px;color:#e6d6ff}
.br{font-size:13px;color:#8d80ad;letter-spacing:.14em;margin-bottom:12px;text-align:center}
.r{width:100%}
.pills{display:flex;gap:8px;width:100%}.pills div{flex:1;height:52px;border-radius:26px;border:1px solid #2a1d48;background:#0f0a1d;display:grid;place-items:center;font-weight:700;font-size:15px;color:#cdbdf0}.pills .on{background:#2a1260;border-color:#9b66ff;color:#fff}
.sm{display:flex;gap:8px;width:100%;margin-top:8px}.sm div{flex:1;height:46px;border-radius:23px;display:grid;place-items:center;font-size:14px;color:#9d90b8;border:1px solid #1e1535}
.sm .on{border-color:#6a46b5;color:#d9c8f8;background:#140c2a}
@media (orientation:landscape) and (max-height:500px){
.s{padding:12px 28px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;column-gap:30px}
.top{grid-column:1/3}.orbwrap{grid-column:1;grid-row:2}.np{display:none}.r{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center}
.o3{width:300px;height:300px}.o2{width:240px;height:240px}.o1{width:180px;height:180px}}
@keyframes b{0%,100%{transform:translate(-50%,-50%) scale(.86)}50%{transform:translate(-50%,-50%) scale(1.04)}}
.o1,.o2{animation:b 8s ease-in-out infinite}
</style></head><body><div class="s">
<div class="top"><span class="k">MAIR SLEEP</span><span class="x">×</span></div>
<div class="np"><b>Midnight City</b>M83</div>
<div class="orbwrap"><div class="o3"></div><div class="o2"></div><div class="o1"></div><div class="in"><b>28:14</b><span>stopt om 23:48</span></div></div>
<div class="r"><div class="br">ADEM IN ... EN UIT</div>
<div class="pills"><div>15</div><div class="on">30</div><div>45</div><div>60</div></div>
<div class="sm"><div>Na dit nummer</div><div class="on">Daarna ruis 20 min</div></div></div>
</div></body></html>
