<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sleep 3 Zachte fade</title>
<!-- Idee: je ziet en kiest hoe het volume langzaam zakt. LET OP, extra werk (middel): nu fadet MAIR maar 8 seconden (JFMPlayback.fadeOut). Een fade van 1 tot 10 minuten moet in kleine stapjes via setVolume en moet op iPhone getest worden (achtergrond, limieten van de Spotify-API). Ook: DJ-welterusten voor de fade (bestaande DJ en TTS, middel). -->
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#08060f;color:#f2ecff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden}
.s{height:100dvh;padding:20px 20px 22px;display:flex;flex-direction:column;background:radial-gradient(circle at 80% 0,#1d1038 0,#08060f 55%)}
.top{display:flex;justify-content:space-between;align-items:center}.k{font-size:11px;letter-spacing:.18em;font-weight:800;color:#b07cff}.x{width:44px;height:44px;border-radius:50%;border:1px solid #2b1c4b;display:grid;place-items:center;color:#c18aff;font-size:22px}
.h{font-size:15px;color:#9d90b8;margin-top:14px}.h b{display:block;font-size:32px;color:#f7f2ff;letter-spacing:-.03em;margin-top:2px}
.graph{margin:16px 0 6px;border-radius:22px;background:#0f0a1d;border:1px solid #251a40;padding:12px 10px 8px}
.graph svg{width:100%;height:auto;display:block}.axis{display:flex;justify-content:space-between;font-size:11px;color:#6f6290;padding:0 6px}
.lab{font-size:12px;letter-spacing:.14em;font-weight:800;color:#7f72a0;margin:14px 0 8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seg div{height:50px;border-radius:15px;background:#130d24;border:1px solid #2a1d48;display:grid;place-items:center;font-weight:700;font-size:16px;color:#cdbdf0}
.seg .on{background:linear-gradient(150deg,#8f46f5,#5a25c9);border-color:#b98aff;color:#fff}
.opt{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#d9ccf3;background:#0f0a1d;border:1px solid #251a40;border-radius:16px;padding:12px 16px}
.sw{width:50px;height:28px;border-radius:14px;background:#2a1d48;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}.sw.on{background:#8f46f5}.sw.on:after{left:25px}
.opt small{display:block;font-size:11px;color:#7f72a0;margin-top:2px}
.go{margin-top:auto;height:60px;border-radius:20px;background:linear-gradient(135deg,#9b4dff,#6a2fd8);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 12px 36px rgba(120,60,220,.35)}
.go2{height:42px;display:grid;place-items:center;color:#8d80ad;font-size:14px;margin-top:4px}
@media (orientation:landscape) and (max-height:500px){
.s{padding:12px 24px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr;column-gap:26px}
.top{grid-column:1/3}.h{margin-top:4px;grid-column:1;font-size:13px;grid-row:2;align-self:start}.h b{font-size:26px}
.graph{margin:0}.g{grid-column:1;grid-row:2;align-self:center}.h{display:none}
.r{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center}.lab{margin-top:6px}.go{margin-top:10px;height:50px}.go2{height:32px}.opt{padding:8px 14px;margin-top:8px}}
</style></head><body><div class="s">
<div class="top"><span class="k">MAIR SLEEP</span><span class="x">×</span></div>
<div class="g"><div class="h">Stopt over 30 minuten<b>Zacht uit om 23:48</b></div>
<div class="graph"><svg viewBox="0 0 340 130"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b4dff" stop-opacity=".55"/><stop offset="1" stop-color="#9b4dff" stop-opacity="0"/></linearGradient></defs>
<path d="M8 28 H215 C255 28 285 100 332 112 V122 H8Z" fill="url(#g)"/><path d="M8 28 H215 C255 28 285 100 332 112" fill="none" stroke="#c18aff" stroke-width="3" stroke-linecap="round"/>
<line x1="215" y1="12" x2="215" y2="122" stroke="#3b2a66" stroke-dasharray="4 4"/><circle cx="8" cy="28" r="6" fill="#fff"/><text x="222" y="22" fill="#9d90b8" font-size="11">volume zakt hier</text></svg>
<div class="axis"><span>nu</span><span>23:43</span><span>23:48 pauze</span></div></div></div>
<div class="r"><div class="lab">STOPPEN OVER</div><div class="seg"><div>15</div><div class="on">30</div><div>45</div><div>60</div></div>
<div class="lab">ZACHT UITFADEN</div><div class="seg"><div>Kort</div><div>2 min</div><div class="on">5 min</div><div>10 min</div></div>
<div class="opt"><div>DJ zegt welterusten<small>kort, vlak voor de fade begint</small></div><span class="sw on"></span></div>
<div class="go">Start slaaptimer</div><div class="go2">Stop na dit nummer</div></div>
</div></body></html>
