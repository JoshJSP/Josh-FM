name: Josh FM predeploy

on:
  pull_request:
    branches: [main, release/product-beta]
  push:
    branches:
      - main
      - 'agent/**'
      - 'update/mair-easy-use-redesign'

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Product Beta release gate
        run: npm run predeploy
