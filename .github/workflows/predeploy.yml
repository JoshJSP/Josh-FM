name: Josh FM predeploy

on:
  pull_request:
    branches: [main, release/product-beta]
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static predeploy
        run: node scripts/predeploy-check-build1.mjs
      - run: npm run smoke
      - run: npm run channel-tap
      - run: npm run hotfix-check
      - name: Build 1 radio-core checks
        if: startsWith(github.head_ref, 'build/product-beta-01-')
        run: node scripts/build1-radio-core-check-v2.mjs
      - name: Build 2 DJ quality checks
        if: startsWith(github.head_ref, 'build/product-beta-02-')
        run: node scripts/build2-check.mjs
      - name: Build 3 music intelligence checks
        if: startsWith(github.head_ref, 'build/product-beta-03-')
        run: node scripts/build3-check.mjs
      - name: Build 4 personal learning checks
        if: startsWith(github.head_ref, 'build/product-beta-04-')
        run: node -e "const fs=require('fs');const p=fs.readFileSync('personal-learning-v4.js','utf8'),m=fs.readFileSync('music-intelligence-v3.js','utf8'),v=fs.readFileSync('version.js','utf8');new Function(p);if(!p.includes('JFMTasteModel')||!m.includes('JFMTasteModel?.score')||!m.includes('rerank')||!v.includes('personal-learning-v4.js'))process.exit(1);console.log('PASS Build 4')"
      - name: Build 9 data portability checks
        if: startsWith(github.head_ref, 'build/product-beta-09')
        run: node scripts/build9-check.mjs
