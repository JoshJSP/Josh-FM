name: Josh FM Webapp Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'manifest.webmanifest'
      - '.github/workflows/webapp-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify HTML assets exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'(?:src|href)="([^"?#]+)', html))
          missing=[]
          for ref in refs:
              if ref.startswith(('http://','https://','#','mailto:')): continue
              p=Path(ref.lstrip('./'))
              if not p.exists(): missing.append(ref)
          print('Referenced local assets:', sorted(refs))
          if missing: raise SystemExit('Missing assets: '+', '.join(missing))
          PY

      - name: Verify Piper voice version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          local=Path('local-voice.js').read_text(encoding='utf-8')
          debug=Path('debug-tts.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          m=re.search(r"const VERSION='([^']+)'",local)
          if not m: raise SystemExit('local-voice.js VERSION missing')
          version=m.group(1)
          cache=re.search(r"const CACHE='([^']+)'",sw)
          if not cache: raise SystemExit('sw.js CACHE missing')
          print('Local voice version:',version)
          print('PWA cache:',cache.group(1))
          if version not in debug: raise SystemExit('debug-tts.js does not request current local voice version')
          if version not in sw: raise SystemExit('sw.js does not cache current local voice version')
          required=['Piper','Ronnie','phonem', 'onnx']
          missing=[x for x in required if x.lower() not in (local+debug).lower()]
          if missing: raise SystemExit('Piper runtime markers missing: '+', '.join(missing))
          if 'AudioContext' not in debug: raise SystemExit('AudioContext playback path missing')
          PY

      - name: Verify Piper Ronnie model files
        run: |
          set -euo pipefail
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_NL/ronnie/medium'
          for f in nl_NL-ronnie-medium.onnx nl_NL-ronnie-medium.onnx.json; do
            echo "HEAD $BASE/$f"
            curl --fail --location --retry 4 --retry-delay 3 --silent --show-error --head "$BASE/$f" >/dev/null
          done
          curl --fail --location --retry 4 --retry-delay 3 --silent --show-error "$BASE/nl_NL-ronnie-medium.onnx.json" -o /tmp/ronnie.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ronnie.json',encoding='utf-8'))
          assert str(d.get('language',{}).get('code','')).startswith('nl'), d
          assert int(d.get('audio',{}).get('sample_rate',0))>0, d
          assert d.get('phoneme_type') in ('espeak','text'), d
          print('Piper Ronnie config OK:', d.get('language'), d.get('audio'), d.get('phoneme_type'))
          PY

      - name: Verify latest code is live on Vercel
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import re
          s=open('local-voice.js',encoding='utf-8').read()
          print(re.search(r"const VERSION='([^']+)'",s).group(1))
          PY
          )
          CACHE=$(python - <<'PY'
          import re
          s=open('sw.js',encoding='utf-8').read()
          print(re.search(r"const CACHE='([^']+)'",s).group(1))
          PY
          )
          BASE='https://josh-fm.vercel.app'
          echo "Waiting for live version $VERSION / cache $CACHE"
          ok=0
          for i in $(seq 1 24); do
            echo "Live deployment check $i/24"
            if curl --fail --location --silent --show-error --max-time 20 "$BASE/?smoke=${GITHUB_SHA}" -o /tmp/joshfm.html \
              && curl --fail --location --silent --show-error --max-time 20 "$BASE/local-voice.js?smoke=${GITHUB_SHA}" -o /tmp/live-local.js \
              && curl --fail --location --silent --show-error --max-time 20 "$BASE/debug-tts.js?smoke=${GITHUB_SHA}" -o /tmp/live-debug.js \
              && curl --fail --location --silent --show-error --max-time 20 "$BASE/sw.js?smoke=${GITHUB_SHA}" -o /tmp/live-sw.js \
              && grep -q 'Josh FM' /tmp/joshfm.html \
              && grep -Fq "$VERSION" /tmp/live-local.js \
              && grep -Fq "$VERSION" /tmp/live-debug.js \
              && grep -Fq "$CACHE" /tmp/live-sw.js; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo 'Latest Josh FM code did not become live within the smoke-test window.' >&2
            exit 1
          fi
          echo "Live Vercel app is current: $VERSION / $CACHE"
