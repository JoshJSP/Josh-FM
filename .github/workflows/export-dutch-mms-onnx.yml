name: Export Dutch MMS TTS to ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-dutch-mms-onnx.yml'
      - 'scripts/export_mms_nld_onnx.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'transformers>=4.45,<5' 'optimum[onnxruntime]>=1.23' 'onnx>=1.16' 'onnxruntime>=1.19' 'onnxscript>=0.1' 'torch>=2.4' 'huggingface_hub>=0.25' 'soundfile>=0.12' 'numpy<2.1'

      - name: Export and validate Dutch model
        run: python scripts/export_mms_nld_onnx.py

      - name: Show output
        run: |
          find dist/mms-tts-nld-onnx -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - name: Upload browser model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-tts-nld-onnx
          path: dist/mms-tts-nld-onnx/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Pages payload
        run: |
          touch dist/.nojekyll
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Josh FM Local Voice Model</title>
          <h1>Josh FM Local Voice Model</h1>
          <p>Dutch MMS neural TTS model for local browser inference.</p>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
