name: Josh FM predeploy

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run predeploy
